<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamentos Cuantitativos para Negocios Creativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .landing-main{ max-width:820px; margin:0 auto; padding:32px 24px 60px; }
  .landing-header{ padding:22px 24px; }
  .unidad-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gris-nota);
    margin:22px 0 8px;
  }
  .lista-semanas{ display:flex; flex-direction:column; gap:8px; }
  .semana-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 16px;
    background:#fff;
    border:1px solid var(--linea);
    border-radius:8px;
    text-decoration:none;
    color:var(--tinta);
    transition:border-color .15s ease;
  }
  .semana-item.disponible:hover{ border-color:var(--azul); }
  .semana-item .num{
    font-family:'IBM Plex Mono',monospace;
    color:var(--gris-nota);
    font-size:13px;
    min-width:70px;
  }
  .semana-item .titulo{ flex:1; font-size:14.5px; }
  .semana-item .estado{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:3px 8px;
    border-radius:5px;
  }
  .estado.listo{ background:var(--nota-fondo); color:var(--azul-oscuro); }
  .estado.pendiente{ background:var(--nota-fondo); color:var(--gris-nota); }
  .semana-item.pendiente{ cursor:default; opacity:.6; pointer-events:none; }
  .glosario-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    font-size:13px;
    color:#fff;
    opacity:.85;
    text-decoration:none;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.04em;
  }
  .glosario-link:hover{ opacity:1; text-decoration:underline; }
</style>
</head>
<body>

<header class="top landing-header">
  <div class="eyebrow">CENTRO: Negocios e Industrias Creativas</div>
  <h1>Fundamentos Cuantitativos para Negocios Creativos</h1>
  <div class="sub">15 semanas · 5 unidades. Cada sesión combina teoría, auditoría de un referente real, y la ficha de tu propio micro-emprendimiento.</div>
  <a href="glosario/index.html" class="glosario-link">Glosario del curso →</a>
  <a href="evaluacion.html" class="glosario-link">Evaluación del curso →</a>
</header>

<main class="landing-main">

  <!-- La lista de sesiones se arma desde sesiones.csv, no se edita a mano. -->
  <div id="listaSesiones"><p style="color:var(--gris-nota);padding:24px 0;">Cargando sesiones…</p></div>

</main>

<script src="assets/sesiones.js"></script>
<script>
  FCNC.pintarIndice('listaSesiones');
</script>

</body>
</html>
